name: nsclc-staging
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Core scientific stack
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=2.0
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.13
  - jupyterlab>=4.0

  # PyTorch (CUDA 11.8 build — swap cu118 for cpu if no GPU)
  - pytorch=2.1.*
  - torchvision=0.16.*
  - torchaudio=2.1.*
  - pytorch-cuda=11.8

  - pip:
    # Medical imaging
    - monai[all]>=1.3
    - nibabel>=5.1
    - pydicom>=2.4
    - SimpleITK>=2.3
    - nnunetv2>=2.2

    # NLP / LLM stack
    - transformers>=4.38
    - tokenizers>=0.15
    - sentence-transformers>=2.6
    # ClinicalBERT — loaded via HuggingFace hub at runtime:
    # emilyalsentzer/Bio_ClinicalBERT
    - accelerate>=0.26

    # RAG / Vector DB
    - chromadb>=0.4
    - langchain>=0.1
    - langchain-community>=0.0.20
    - langchain-core>=0.1

    # Multi-agent orchestration
    - langgraph>=0.1

    # Radiomics
    - pyradiomics>=3.1

    # Config management
    - hydra-core>=1.3
    - omegaconf>=2.3

    # Experiment tracking
    - wandb>=0.16
    - mlflow>=2.10

    # Testing
    - pytest>=7.4
    - pytest-cov>=4.1

    # Utilities
    - tqdm>=4.66
    - rich>=13.7
    - pyyaml>=6.0
    - python-dotenv>=1.0
    - loguru>=0.7
    - typer>=0.9
