# Default settings for the staging pipeline.
# Each top level section is passed to the matching agent by StagingOrchestrator,
# so the keys below are exactly the ones the agents read.

project:
  name: nsclc-tnm-staging
  version: "1.0.0"
  seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  nsclc_radiomics_dir: data/raw/NSCLC-Radiomics
  clinical_csv: data/raw/Lung1_clinical.csv
  mimic_notes_dir: data/raw/mimic-iv-note-2.2/note

preprocessing:
  ct:
    target_spacing_zyx: [3.0, 1.0, 1.0]   # mm; native z spacing kept to avoid inventing slices
    clip_hu: [-1000, 400]
    normalize: z_score

# Vision Agent: nnU-Net v2 segmentation and size to T rule
vision:
  nnunet_model: results/nnunet/Dataset001_NSCLCRadiomics/nnUNetTrainer_250epochs__nnUNetPlans__3d_fullres
  device: cpu                     # cpu | cuda
  spacing_zyx: [3.0, 1.0, 1.0]
  min_tumour_voxels: 10
  diameter_method: axial          # axial | diameter3d
  use_largest_component: true

# Clinical Context Agent: embedding retrieval and negation aware N/M extraction
clinical_context:
  embedding_model: emilyalsentzer/Bio_ClinicalBERT
  use_semantic: true              # false uses keyword retrieval only
  rag_k: 8                        # sentences retrieved per patient
  min_confidence: 0.5

# Guideline Logic Agent: deterministic IASLC 8th edition lookup
guideline_logic:
  rules_path: configs/iaslc_rules.yaml
  min_confidence: 0.5
  adjudication:
    conflict_resolution: conservative

evaluation:
  metrics:
    - t_accuracy
    - n_accuracy
    - stage_accuracy
    - cohens_kappa
